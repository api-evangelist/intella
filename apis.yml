aid: intella
name: Intella
description: 'Intella is an enterprise Arabic AI company founded in 2021 and headquartered
  in the MENA region, building voice and customer-experience technology that natively
  understands 25+ Arabic dialects and cultural nuances rather than adapting generic
  global models. Its product suite includes Ziila (an AI voice agent for inbound/outbound
  conversations), intellaCX (conversation analytics for sentiment and churn), intellaMX
  (media translation and dialectal subtitling), and intellaVX (Arabic speech-to-text).
  Intella raised a $12.5M Series A led by Prosus and is backed by 500 Global, Hala
  Ventures, and Hearst, with partnerships including Visa and Jumia Egypt. The company
  is currently a sales-led enterprise vendor with no public developer API or documentation
  surface; this profile is maintained as an API Evangelist network lead.'
